<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>漢字クイズ 2分チャレンジ</title>
<style>
:root{--bg:#fff8e7;--ink:#2b2b2b;--card:#fff;--accent:#ff7a1a;--ok:#2fb344;--ng:#e5484d;--line:#ead9b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px}
.hud div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px;text-align:center}
.hud small{display:block;font-size:12px;color:#8a7a55}
.hud b{font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1}
#time.low{color:var(--ng)}
#bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--accent)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center}
.tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 14px;font-size:14px;font-weight:bold}
#kanji{font-size:clamp(96px,32vw,160px);line-height:1.15;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
#q{font-size:18px;font-weight:bold}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font:inherit;font-size:22px;font-weight:bold;padding:18px 6px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;cursor:pointer;min-height:76px}
.choices button small{display:block;font-size:12px;font-weight:normal;color:#8a7a55}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.ok small{color:#fff}
.choices button.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.choices button.ng small{color:#fff}
.fx{min-height:24px;text-align:center;font-weight:bold;font-size:18px}
.big{font-size:20px;border:0;background:var(--accent);color:#fff;border-radius:16px;padding:16px 32px;font-weight:bold;cursor:pointer;font-family:inherit}
.hidden{display:none!important}
#mute{position:fixed;top:8px;right:8px;font-size:22px;background:var(--card);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;z-index:5}
#end .score{font-size:72px;font-weight:bold;margin:4px 0}
p{margin:6px 0}
</style>
</head>
<body>
<button id="mute" aria-label="音のオンオフ">🔊</button>
<main>
  <div class="hud">
    <div><small>ポイント</small><b id="score">0</b></div>
    <div><small>のこり時間</small><b id="time">2:00</b></div>
  </div>
  <div id="bar"><i></i></div>

  <section id="start" class="card">
    <h1 style="margin:4px 0">漢字クイズ</h1>
    <p>小学1〜6年生の漢字 1026字</p>
    <p>①読み方 → ②部首 の4択をくりかえし出題！</p>
    <p>正解 <b style="color:var(--ok)">+1</b>　まちがい <b style="color:var(--ng)">−1</b>　制限時間 2分</p>
    <p id="best" style="color:#8a7a55"></p>
    <button class="big" id="go">スタート</button>
  </section>

  <section id="play" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <span class="tag" id="tag"></span>
      <div id="kanji"></div>
      <div id="q"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="fx" id="fx"></div>
  </section>

  <section id="end" class="card hidden">
    <h2 style="margin:4px 0">タイムアップ！</h2>
    <div class="score" id="final"></div>
    <p id="detail"></p>
    <p id="newbest" style="color:var(--accent);font-weight:bold"></p>
    <button class="big" id="again">もういちど</button>
  </section>
</main>

,"130":["肉","にく・にくづき"],"131":["臣","しん"],"132":["自","みずから"],"133":["至","いたる"],"134":["臼","うす"],"135":["舌","した"],"137":["舟","ふね"],"138":["艮","こんづくり"],"139":["色","いろ"],"140":["艹","くさかんむり"],"142":["虫","むし"],"143":["血","ち"],"144":["行","ぎょうがまえ"],"145":["衣","ころも・ころもへん"],"146":["襾","にし"],"147":["見","みる"],"148":["角","つの"],"149":["言","ごんべん"],"150":["谷","たに"],"151":["豆","まめ"],"152":["豕","ぶた"],"154":["貝","かい"],"155":["赤","あか"],"156":["走","はしる"],"157":["足","あし"],"158":["身","み"],"159":["車","くるま"],"160":["辛","からい"],"161":["辰","しんのたつ"],"162":["辶","しんにょう"],"163":["阝","おおざと"],"164":["酉","とりへん"],"166":["里","さと"],"167":["金","かね"],"168":["長","ながい"],"169":["門","もんがまえ"],"170":["阝","こざとへん"],"172":["隹","ふるとり"],"173":["雨","あめ"],"174":["青","あお"],"175":["非","あらず"],"176":["面","めん"],"177":["革","かくのかわ"],"180":["音","おと"],"181":["頁","おおがい"],"182":["風","かぜ"],"183":["飛","とぶ"],"184":["食","しょく"],"185":["首","くび"],"186":["香","かおり"],"187":["馬","うま"],"188":["骨","ほね"],"189":["高","たかい"],"195":["魚","うお"],"196":["鳥","とり"],"198":["鹿","しか"],"199":["麦","むぎ"],"201":["黄","き"],"203":["黒","くろ"],"209":["鼻","はな"]};
const DURATION = 120, FEEDBACK_MS = 500;
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 読みの候補プール(音読みはカタカナ、訓読みはひらがな)
const ALL_ON = [...new Set(KANJI.flatMap(k => k.on))];
const ALL_KUN = [...new Set(KANJI.flatMap(k => k.kun))];
const RAD_IDS = Object.keys(RAD);


// ---- 効果音とBGM(Web Audio、音源ファイル不要) ----
let ac = null, master = null, muted = false, bgmTimer = null, nextT = 0, beat = 0;
function audioInit(){
  if (!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(freq, t, dur, type, vol){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function sfxOk(){ if (!ac) return; const t = ac.currentTime; tone(880, t, 0.12, 'sine', 0.35); tone(1318.5, t + 0.1, 0.25, 'sine', 0.35); }
function sfxNg(){ if (!ac) return; const t = ac.currentTime; tone(220, t, 0.18, 'sawtooth', 0.2); tone(165, t + 0.15, 0.3, 'sawtooth', 0.2); }
function sfxEnd(){ if (!ac) return; const t = ac.currentTime; [784, 659, 523].forEach((f, i) => tone(f, t + i * 0.18, 0.3, 'triangle', 0.3)); }

// 明るいペンタトニックの8拍ループ(メロディ+ベース)
const STEP = 0.2;
const MELODY = [523.25, 659.25, 783.99, 659.25, 880, 783.99, 659.25, 587.33, 523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 587.33];
const BASS = [130.81, 130.81, 196, 196, 220, 220, 196, 196];
function schedule(){
  while (nextT < ac.currentTime + 0.3){
    const i = beat % MELODY.length;
    tone(MELODY[i], nextT, STEP * 0.9, 'triangle', 0.09);
    if (i % 2 === 0) tone(BASS[(i / 2) % BASS.length], nextT, STEP * 1.8, 'sine', 0.12);
    nextT += STEP; beat++;
  }
}
function bgmStart(){ if (!ac) return; bgmStop(); beat = 0; nextT = ac.currentTime + 0.1; bgmTimer = setInterval(schedule, 100); schedule(); }
function bgmStop(){ clearInterval(bgmTimer); bgmTimer = null; }
function setMuted(m){
  muted = m; $('mute').textContent = m ? '🔇' : '🔊';
  if (master) master.gain.setTargetAtTime(m ? 0 : 1, ac.currentTime, 0.02);
  try { localStorage.setItem('kanjiQuizMuted', m ? '1' : ''); } catch(e){}
}
$('mute').onclick = () => { audioInit(); setMuted(!muted); };
try { muted = !!localStorage.getItem('kanjiQuizMuted'); $('mute').textContent = muted ? '🔇' : '🔊'; } catch(e){}

let score, right, wrong, deadline, timer, queue, step, locked, state = 'idle';

function bestGet(){ try { return +localStorage.getItem('kanjiQuizBest') || 0; } catch(e){ return 0; } }
function bestSet(v){ try { localStorage.setItem('kanjiQuizBest', v); } catch(e){} }
function showBest(){ const b = bestGet(); $('best').textContent = b ? 'ハイスコア：' + b + ' ポイント' : ''; }

function fmt(sec){ const s = Math.max(0, Math.ceil(sec)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function start(){
  audioInit();
  score = right = wrong = 0; step = 0; state = 'play';
  queue = shuffle(KANJI);
  $('score').textContent = 0;
  $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('play').classList.remove('hidden');
  deadline = Date.now() + DURATION * 1000;
  clearInterval(timer); timer = setInterval(tick, 100); tick();
  bgmStart();
  next();
}

function tick(){
  const left = (deadline - Date.now()) / 1000;
  $('time').textContent = fmt(left);
  $('time').classList.toggle('low', left <= 10);
  $('bar').firstElementChild.style.width = Math.max(0, left / DURATION * 100) + '%';
  if (left <= 0) finish();
}

// 1つの漢字につき「読み」→「部首」の順に連続出題
function next(){
  if (state !== 'play') return;
  const k = queue[Math.floor(step / 2) % queue.length];
  const isRead = step % 2 === 0;
  step++;
  locked = false;
  $('kanji').textContent = k.c;
  $('fx').textContent = '';
  let opts;
  if (isRead){
    $('tag').textContent = '① 読み方';
    $('q').textContent = 'この漢字の読み方は？（音読み・訓読み）';
    const own = new Set([...k.on, ...k.kun]);
    const goodOn = k.on.slice(0, 2), goodKun = k.kun.slice(0, 2);
    const good = [...goodOn, ...goodKun];
    const correct = good[rnd(good.length)];
    const pool = shuffle(goodOn.includes(correct) ? ALL_ON : ALL_KUN).filter(r => !own.has(r));
    opts = shuffle([correct, ...pool.slice(0, 3)]).map(v => ({ label: v, ok: v === correct }));
  } else {
    $('tag').textContent = '② 部首';
    $('q').textContent = 'この漢字の部首はどれ？';
    const correct = String(k.r);
    // 選択肢はひらがなの名前のみ。同じ名前(ひ・きなど)が並ばないようにする
    const picked = [correct], seen = new Set([RAD[correct][1]]);
    for (const r of shuffle(RAD_IDS)){
      if (picked.length === 4) break;
      if (!seen.has(RAD[r][1])){ seen.add(RAD[r][1]); picked.push(r); }
    }
    opts = shuffle(picked).map(v => ({ label: RAD[v][1], ch: RAD[v][0], ok: v === correct }));
  }
  const box = $('choices'); box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.textContent = o.label;
    b.onclick = () => answer(b, o, opts);
    o.el = b;
    box.appendChild(b);
  });
}

function answer(btn, o, opts){
  if (locked || state !== 'play') return;
  locked = true;
  const fx = $('fx');
  // 部首の問題は、選んだあとに部首の字を答えと併記する
  opts.forEach(x => { if (x.ch){ x.el.textContent = x.ch + '　' + x.label; } });
  const c = opts.find(x => x.ok), hint = c.ch ? '　部首は「' + c.ch + '」' : '';
  if (o.ok){ score++; right++; btn.classList.add('ok'); sfxOk(); fx.textContent = '⭕ +1' + hint; fx.style.color = 'var(--ok)'; }
  else {
    sfxNg(); score--; wrong++; btn.classList.add('ng'); fx.style.color = 'var(--ng)';
    c.el.classList.add('ok');
    fx.textContent = '❌ −1　正解は「' + c.label + '」' + hint;
  }
  $('score').textContent = score;
  setTimeout(next, (o.ok ? FEEDBACK_MS : FEEDBACK_MS + 600) + (c.ch ? 400 : 0));
}

function finish(){
  if (state !== 'play') return;
  state = 'end'; clearInterval(timer); bgmStop(); sfxEnd();
  $('time').textContent = '0:00';
  $('play').classList.add('hidden'); $('end').classList.remove('hidden');
  $('final').textContent = score + ' ポイント';
  $('detail').textContent = '正解 ' + right + ' 問 ／ まちがい ' + wrong + ' 問';
  const b = bestGet();
  $('newbest').textContent = score > b ? '🎉 ハイスコア更新！' : '';
  if (score > b) bestSet(score);
  showBest();
}

$('go').onclick = start;
$('again').onclick = start;
showBest();
</script>
